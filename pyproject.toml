[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sysml2py-lab"
version = "0.1.0"
description = "Corpus-driven generator for sysml2py (MVP: brace parsing + normalized roundtrip + codegen)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Westfall-io" }]
license = { text = "MIT" }
dependencies = [
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.scripts]
sysml2py-lab = "sysml2py_lab.cli:main"

[tool.hatch.build]
packages = ["src/sysml2py_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
