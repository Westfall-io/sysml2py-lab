[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sysml2py-lab"
version = "0.1.0"
description = "Corpus-driven generator for sysml2py (MVP: brace parsing + normalized roundtrip + codegen)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Westfall-io" }]
license = { text = "MIT" }
dependencies = [
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "sysml-windtrader>=0.2.2",
]

[project.scripts]
sysml2py-lab = "sysml2py_lab.cli:main"

[tool.hatch.build]
packages = ["src/sysml2py_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Scoped, reproducible lint gate (issue #11 regression harness).
#
# We intentionally pin a CONSERVATIVE rule set (ruff's classic core
# E4/E7/E9/F) rather than ruff 0.16's full default.  The repo carries
# pre-existing debt under the expanded rules (BLE001 blind-excepts in
# cli.py, UP035/UP037 in model.py, SIM102/etc in grammar/, all in files
# owned by other maintainers) that is OUT OF SCOPE for the regression
# harness PR.  The gate protects the harness + the changed files; widening
# it to the whole tree is a tracked follow-up.
#
# per-file-ignores: none.  The read-side modules (lexer/ir/reader) are copied
# VERBATIM into the generated distributable, which runs `ruff check` over its
# whole src tree with no per-file-ignores.  To keep that gate green and avoid
# shipping lint debt in the distributed package, these modules are kept clean
# standalone (docstring-first layout, no unused imports, narrow excepts).

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
