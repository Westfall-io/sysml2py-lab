name: Release

# Issue #13 (phase-8): release the generated sysml2py library.
#
# Triggers:
#   - a version tag `v1.0.0`, `v1.1.0`, … (normal release — always publishes)
#   - manual `workflow_dispatch` (build/verify + optionally publish):
#       * publish_to_pypi: false  -> artifact-only dry-run (default)
#       * publish_to_pypi: true   -> build, verify, AND publish (owner action,
#         gated by the `pypi` environment with PyPI trusted publishing)
#       * version: optional manual version override (defaults to 1.0.0)
#
# The release is REPRODUCIBLE from (lab commit, spec, corpus manifest)
# alone: `sysml2py-lab generate` is deterministic, provenance hashes the
# committed spec + corpus artifacts, and the build runs the full regression
# suite + windtrader gate on exactly the wheel that ships.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the built wheel/sdist to PyPI (trusted publishing, environment: pypi)"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to build for a manual run (default 1.0.0; ignored on tag push)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build + verify wheel (regenerate, regress, windtrader gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install lab (dev extra) + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Run unit + corpus + cast regression suite
        run: pytest tests/ -q

      - name: Generate the release package (deterministic, version from tag)
        # Version resolution:
        #   tag push        -> `${GITHUB_REF_NAME#v}` (e.g. v1.0.1 -> 1.0.1)
        #   manual + input  -> the `version` input (owner override)
        #   manual, no input -> bake-in default (1.0.0) — a valid build.
        # On `workflow_dispatch` GITHUB_REF_NAME is the BRANCH name, not a
        # tag, so a manual run must never pass it to --version (invalid PEP
        # 440).  Manual dispatch is the only pre-tag exerciser of the wheel
        # (ci.yml never builds), so this must stay a valid build.
        run: |
          rm -rf /tmp/rel-gen
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sysml2py-lab generate --out /tmp/rel-gen --version "${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            sysml2py-lab generate --out /tmp/rel-gen --version "${{ inputs.version }}"
          else
            sysml2py-lab generate --out /tmp/rel-gen
          fi

      - name: Regress replay + roundtrip + goldens + coverage
        run: |
          sysml2py-lab regress replay --generated /tmp/rel-gen
          sysml2py-lab regress roundtrip --generated /tmp/rel-gen
          sysml2py-lab regress goldens --generated /tmp/rel-gen
          sysml2py-lab regress coverage --generated /tmp/rel-gen

      - name: Corpus verify (sha + parse)
        run: sysml2py-lab corpus verify

      - name: Windtrader gate — LIVE oracle (real validator + JVM)
        # W2-4: a PyPI publish is irreversible, so use the strongest gate
        # (live windtrader-java round-trip) rather than only the hermetic
        # fixture replay.  AC#2: generated text must validate end-to-end.
        run: sysml2py-lab validate corpus --generated /tmp/rel-gen

      - name: Build the wheel + sdist
        run: |
          python -m build --outdir /tmp/dist /tmp/rel-gen/sysml2py

      - name: Assert wheel contents (grammar resource + provenance + version)
        env:
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '1.0.0' }}
        run: |
          python - <<'EOF'
          import glob, os, zipfile
          wheels = glob.glob("/tmp/dist/*.whl")
          assert wheels, "no wheel built"
          w = wheels[0]
          names = set(zipfile.ZipFile(w).namelist())
          assert any(n.endswith(".tx") for n in names), "grammar .tx missing"
          assert any(n.endswith("provenance.py") for n in names), "provenance missing"
          # W2-1: wheel filename MUST carry the exact version (tag, manual
          # input, or default).  Compare PEP 440-normalized: `v1.0.0-rc1` →
          # wheel `1.0.0rc1`.)
          expected = "sysml2py-" + os.environ["EXPECTED_VERSION"].lstrip("v")
          fname = w.split("/")[-1]
          assert fname.replace("-", "").startswith(expected.replace("-", "")), (
              f"{fname} != expected {expected}"
          )
          print("wheel ok:", fname)
          EOF

      - name: Import-graph smoke (clean venv, no lab/heavy deps)
        env:
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '1.0.0' }}
        run: |
          python -m venv /tmp/rel-venv
          /tmp/rel-venv/bin/pip install --quiet /tmp/dist/*.whl
          /tmp/rel-venv/bin/python - <<'EOF'
          import os, sys
          import sysml2py
          forbidden = {"textx", "astropy", "yaml", "sysml2py_lab"}
          loaded = {m.split(".")[0] for m in sys.modules}
          bad = sorted(forbidden & loaded)
          assert not bad, f"forbidden runtime deps: {bad}"
          # W3: compare against the ACTUAL expected version from the tag
          # (or the 1.0.0 default for manual dispatch), not a hard-coded "1."
          expected = os.environ["EXPECTED_VERSION"].lstrip("v").replace("-", "")
          assert sysml2py.__version__.replace("-", "") == expected, (
              f"version {sysml2py.__version__} != expected {expected}"
          )
          print("clean import OK:", sysml2py.__version__)
          EOF

      - name: Upload wheel + sdist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: /tmp/dist/*

  publish:
    name: Publish to PyPI
    needs: build-and-verify
    # Publish when triggered by a version tag (normal release) OR by a
    # manual dispatch with `publish_to_pypi: true` (owner-driven release from
    # the Actions UI).  Manual runs default to build/verify-only dry-run.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: /tmp/dist
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: /tmp/dist
