name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff) — new/changed files + generated output
        # Scoped to this PR's surface + the generated package.  The repo has
        # pre-existing ruff findings in unchanged files (ir.py, grammar/,
        # model.py, cli.py BLE001) owned by other maintainers; gating the
        # WHOLE tree would make CI red-on-first-run on unrelated debt.  The
        # harness + generated output must stay ruff-clean.
        run: |
          ruff check src/sysml2py_lab/regress.py tests/test_regress.py
          sysml2py-lab generate --out /tmp/ci-lint
          ruff check /tmp/ci-lint/sysml2py/src

      - name: Unit + corpus + cast regression suite
        run: pytest tests/ -q

      - name: Generate package (deterministic)
        run: |
          rm -rf /tmp/ci-gen
          sysml2py-lab generate --out /tmp/ci-gen

      - name: Determinism (generate twice, byte-identical)
        run: |
          rm -rf /tmp/ci-a /tmp/ci-b
          sysml2py-lab generate --out /tmp/ci-a
          sysml2py-lab generate --out /tmp/ci-b
          diff -r --exclude=.ruff_cache --exclude=__pycache__ /tmp/ci-a /tmp/ci-b || (echo "DETERMINISM FAILED" && exit 1)

      - name: Regress replay (IR + generated classes canonical)
        run: sysml2py-lab regress replay --generated /tmp/ci-gen

      - name: Regress roundtrip (definition -> dump canonical + semantic)
        run: sysml2py-lab regress roundtrip --generated /tmp/ci-gen

      - name: Regress goldens (drift check)
        run: sysml2py-lab regress goldens --generated /tmp/ci-gen

      - name: Regress coverage ratchet (blocks decreases)
        run: sysml2py-lab regress coverage --generated /tmp/ci-gen

      - name: Corpus verify (sha + parse)
        run: sysml2py-lab corpus verify
