name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit + corpus + cast regression suite
        run: pytest tests/ -q

      - name: Generate package (deterministic)
        run: |
          rm -rf /tmp/ci-gen
          sysml2py-lab generate --out /tmp/ci-gen

      - name: Determinism (generate twice, byte-identical)
        run: |
          rm -rf /tmp/ci-a /tmp/ci-b
          sysml2py-lab generate --out /tmp/ci-a
          sysml2py-lab generate --out /tmp/ci-b
          diff -r --exclude=.ruff_cache --exclude=__pycache__ /tmp/ci-a /tmp/ci-b || (echo "DETERMINISM FAILED" && exit 1)

      - name: Regress replay (IR + generated classes canonical)
        run: sysml2py-lab regress --generated /tmp/ci-gen replay

      - name: Regress roundtrip (definition -> dump canonical)
        run: sysml2py-lab regress --generated /tmp/ci-gen roundtrip

      - name: Regress goldens (drift check)
        run: sysml2py-lab regress --generated /tmp/ci-gen goldens

      - name: Regress coverage ratchet (blocks decreases)
        run: sysml2py-lab regress --generated /tmp/ci-gen coverage

      - name: Corpus verify (sha + parse)
        run: sysml2py-lab corpus verify
